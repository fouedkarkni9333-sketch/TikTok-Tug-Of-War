<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معركة الشد الحارق - TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090d16;
            color: #ffffff;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* تأثير اهتزاز الشاشة عند الحماسة */
        @keyframes shake {
            0% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-5px, 5px) rotate(-1deg); }
            40% { transform: translate(5px, -5px) rotate(1deg); }
            60% { transform: translate(-3px, -3px) rotate(0deg); }
            80% { transform: translate(3px, 3px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .shake-effect { animation: shake 0.3s ease-in-out; }

        .game-container {
            width: 95%;
            max-width: 650px;
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 3px solid #334155;
            border-radius: 25px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(255,255,255,0.05);
            text-align: center;
            position: relative;
        }

        .battle-title {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
            background: linear-gradient(90deg, #ff3366, #ff9900, #33ccff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255,51,102,0.4);
        }

        .teams-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .team-red-box { color: #ff3366; text-shadow: 0 0 12px rgba(255, 51, 102, 0.6); }
        .team-blue-box { color: #33ccff; text-shadow: 0 0 12px rgba(51, 204, 255, 0.6); }

        /* مسار شد الحبل الاحترافي */
        .rope-arena {
            position: relative;
            width: 100%;
            height: 70px;
            background: #020617;
            border-radius: 35px;
            border: 3px solid #475569;
            margin: 30px 0;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.9);
        }

        .center-marker {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #fbbf24;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #fbbf24;
            z-index: 1;
        }

        /* الشخصيات المتحركة (بدل الشعلة البسيطة) */
        .fighters {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            z-index: 3;
            transition: left 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.7));
        }

        .action-feed {
            font-size: 16px;
            color: #e2e8f0;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 12px;
            min-height: 40px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .gift-alert {
            background: linear-gradient(90deg, rgba(234,179,8,0.2), rgba(250,204,21,0.4));
            border: 2px dashed #facc15;
            color: #fef08a;
            padding: 10px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* شاشة الفوز الحماسية */
        .winner-modal {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.96);
            border-radius: 22px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        .winner-modal h2 { font-size: 36px; margin-bottom: 10px; color: #facc15; text-shadow: 0 0 20px #facc15; }
        
        .restart-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(34,197,94,0.6);
            margin-top: 15px;
        }

        /* أزرار التجربة الحية */
        .testing-panel {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .btn-test {
            padding: 10px 16px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 14px;
        }
    </style>
</head>
<body id="mainBody">

    <div class="game-container" id="gameCard">
        <div class="battle-title">🔥 معركة الشد الحزامي المباشر 🔥</div>

        <div class="teams-info">
            <div class="team-red-box">
                🔴 الفريق الأحمر<br>
                <span style="font-size: 14px; background: rgba(255,51,102,0.2); padding: 3px 10px; border-radius: 8px; border: 1px solid #ff3366;">اكتب: 1</span>
            </div>
            <div style="font-size: 28px; font-weight: 900; color: #facc15;">VS</div>
            <div class="team-blue-box">
                🔵 الفريق الأزرق<br>
                <span style="font-size: 14px; background: rgba(51,204,255,0.2); padding: 3px 10px; border-radius: 8px; border: 1px solid #33ccff;">اكتب: 2</span>
            </div>
        </div>

        <div class="rope-arena">
            <div class="center-marker"></div>
            <!-- تم استبدال الشعلة البسيطة بتعبير حماسي مشتعل -->
            <div class="fighters" id="fighterChar">🐂⚡🐂</div>
        </div>

        <div class="action-feed" id="actionFeed">🚀 المعركة اشتعلت! اكتب 1 أو 2 في التعليقات للبدء...</div>

        <div class="gift-alert">
            🌹 هدية (وردة) = ضربة قاضية (+15 خطوة) لفريقك فوراً! 🔥
        </div>

        <!-- شاشة الفوز الحماسية -->
        <div class="winner-modal" id="winnerModal">
            <h2 id="winnerText">🏆 انتصر الفريق الأحمر!</h2>
            <p style="color: #cbd5e1; font-size: 16px;">تم سحق الخصم بنجاح! تبدأ الجولة التالية فوراً...</p>
            <button class="restart-btn" onclick="resetGame()">إعادة المعركة الآن ⚡</button>
        </div>
    </div>

    <!-- أزرار التجربة للتأكد من الحماسة -->
    <div class="testing-panel">
        <button class="btn-test" style="background:#ff3366;" onclick="triggerPull('1', 3, 'فؤاد (تجربة)')">سحب أحمر (+1)</button>
        <button class="btn-test" style="background:#33ccff;" onclick="triggerPull('2', 3, 'مشاهد (تجربة)')">سحب أزرق (+2)</button>
        <button class="btn-test" style="background:#eab308; color:#000;" onclick="triggerPull('1', 15, 'الدعم السريع 🌹')">هدية خارقة 🔥</button>
    </div>

    <script>
        let pos = 50; // من 0 إلى 100
        let active = true;

        const fighterChar = document.getElementById('fighterChar');
        const actionFeed = document.getElementById('actionFeed');
        const winnerModal = document.getElementById('winnerModal');
        const winnerText = document.getElementById('winnerText');
        const gameCard = document.getElementById('gameCard');

        function triggerPull(team, power, user) {
            if (!active) return;

            // إحداث اهتزاز حماسي للشاشة عند السحب القوي أو الهدايا
            if (power > 5) {
                gameCard.classList.add('shake-effect');
                setTimeout(() => gameCard.classList.remove('shake-effect'), 300);
            }

            if (team === '1') {
                pos -= power;
                actionFeed.innerHTML = `🔥 <span style="color:#ff3366">${user}</span> سحب بقوة نحو الأحمر! (-${power})`;
            } else {
                pos += power;
                actionFeed.innerHTML = `⚡ <span style="color:#33ccff">${user}</span> سحب بقوة نحو الأزرق! (+${power})`;
            }

            // الحدود
            if (pos < 5) {
                pos = 5;
                finishBattle("🔴 انتصر الفريق الأحمر بجدارة!");
            } else if (pos > 95) {
                pos = 95;
                finishBattle("🔵 انتصر الفريق الأزرق بجدارة!");
            }

            fighterChar.style.left = pos + '%';
        }

        function finishBattle(title) {
            active = false;
            winnerText.innerText = title;
            winnerModal.style.display = 'flex';
            setTimeout(resetGame, 5000); // إعادة تلقائية بعد 5 ثوانٍ لاستمرار البث
        }

        function resetGame() {
            pos = 50;
            active = true;
            fighterChar.style.left = '50%';
            winnerModal.style.display = 'none';
            actionFeed.innerText = "⚡ جولة جديدة بدأت! احموا فريقكم بالتعليقات والهدايا!";
        }

        // استقبال الـ WebSocket الحقيقي عند ربطه بالبث
        function initWS() {
            try {
                const ws = new WebSocket('ws://localhost:8765');
                ws.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    triggerPull(d.team, d.power, d.user);
                };
                ws.onclose = () => setTimeout(initWS, 3000);
            } catch(err) {
                console.log("وضع التفاعل المحلي نشط");
            }
        }
        initWS();
    </script>
</body>
</html>
