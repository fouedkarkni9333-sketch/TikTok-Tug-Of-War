<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معركة شد السيارات - TikTok Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #070b14;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* اهتزاز عنيف عند التيربو */
        @keyframes heavyShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-8px, 6px) rotate(-1.5deg); }
            40% { transform: translate(8px, -6px) rotate(1.5deg); }
            60% { transform: translate(-6px, -4px) rotate(-1deg); }
            80% { transform: translate(6px, 4px) rotate(1deg); }
        }
        .shake { animation: heavyShake 0.35s ease-in-out; }

        @keyframes engineVibrate {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-2px); }
        }

        .arena-card {
            width: 95%;
            max-width: 680px;
            background: linear-gradient(180deg, #111827 0%, #030712 100%);
            border: 3px solid #374151;
            border-radius: 24px;
            padding: 25px 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(239, 68, 68, 0.15);
            text-align: center;
            position: relative;
        }

        .title-banner {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 18px;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .scoreboard {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 10px;
        }

        .team-box {
            padding: 8px 16px;
            border-radius: 14px;
            font-weight: bold;
            font-size: 17px;
        }
        .red-team {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid #ef4444;
            color: #fca5a5;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
        }
        .blue-team {
            background: rgba(59, 130, 246, 0.15);
            border: 2px solid #3b82f6;
            color: #93c5fd;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        /* مضمار الإسفلت */
        .asphalt-road {
            position: relative;
            width: 100%;
            height: 110px;
            background: #1f2937;
            border-top: 4px dashed #ef4444;
            border-bottom: 4px dashed #3b82f6;
            border-radius: 16px;
            margin: 25px 0;
            overflow: hidden;
            box-shadow: inset 0 0 25px #000000;
            display: flex;
            align-items: center;
        }

        .road-stripes {
            position: absolute;
            width: 100%;
            height: 4px;
            background: repeating-linear-gradient(90deg, #4b5563 0, #4b5563 25px, transparent 25px, transparent 50px);
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.4;
        }

        .finish-center {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #facc15;
            box-shadow: 0 0 15px #facc15;
            transform: translateX(-50%);
            z-index: 1;
        }

        .zone-red { position: absolute; right: 0; top: 0; bottom: 0; width: 12%; background: rgba(239, 68, 68, 0.25); border-left: 2px solid #ef4444; }
        .zone-blue { position: absolute; left: 0; top: 0; bottom: 0; width: 12%; background: rgba(59, 130, 246, 0.25); border-right: 2px solid #3b82f6; }

        .tug-rig {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            transition: left 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            white-space: nowrap;
        }

        .car {
            font-size: 46px;
            animation: engineVibrate 0.15s infinite;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.8));
            user-select: none;
        }

        .car-left { transform: scaleX(1); }
        .car-right { transform: scaleX(-1); }

        .steel-chain {
            width: 65px;
            height: 6px;
            background: repeating-linear-gradient(90deg, #9ca3af 0px, #facc15 6px, #4b5563 12px);
            border-radius: 3px;
            margin: 0 -4px;
            box-shadow: 0 0 10px #facc15;
        }

        .smoke {
            font-size: 20px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .live-ticker {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 10px;
            border-radius: 12px;
            font-size: 15px;
            min-height: 42px;
            margin-bottom: 14px;
            color: #f3f4f6;
        }

        .gift-banner {
            background: linear-gradient(90deg, rgba(245, 158, 11, 0.2), rgba(239, 68, 68, 0.2));
            border: 1px dashed #fbbf24;
            color: #fde047;
            padding: 10px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        .victory-screen {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(3, 7, 18, 0.96);
            border-radius: 22px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }
        .victory-screen h2 { font-size: 32px; color: #facc15; margin-bottom: 10px; }
        .btn-restart {
            background: #10b981;
            color: #000;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ctrl-btn {
            padding: 10px 14px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="arena-card" id="arenaCard">
        <div class="title-banner">🏎️ شد الحبل بالسيارات - LIVE 🔥</div>

        <div class="scoreboard">
            <div class="team-box red-team">
                🔴 السيارة الحمراء<br>
                <span style="font-size:13px;">اكتب: 1</span>
            </div>
            <div style="font-weight:900; color:#facc15; font-size:22px;">⚡ VS ⚡</div>
            <div class="team-box blue-team">
                🔵 السيارة الزرقاء<br>
                <span style="font-size:13px;">اكتب: 2</span>
            </div>
        </div>

        <div class="asphalt-road">
            <div class="road-stripes"></div>
            <div class="zone-red"></div>
            <div class="zone-blue"></div>
            <div class="finish-center"></div>

            <div class="tug-rig" id="tugRig" style="left: 50%;">
                <span class="smoke" id="smokeRight">💨</span>
                <div class="car car-right">🏎️</div>
                <div class="steel-chain"></div>
                <div class="car car-left">🚙</div>
                <span class="smoke" id="smokeLeft">💨</span>
            </div>
        </div>

        <div class="live-ticker" id="ticker">🔥 المحركات جاهزة! اكتب 1 للسيارة الحمراء أو 2 للزرقاء!</div>

        <div class="gift-banner">
            🌹 الوردة = تيربو +15 قوة سحب فورية للسيارة! 🚀
        </div>

        <div class="victory-screen" id="victoryScreen">
            <h2 id="winnerHeading">🏆 اكتسحت السيارة الحمراء وسحبت الخصم!</h2>
            <p style="color:#9ca3af;">الجولة الجديدة تبدأ خلال 5 ثوانٍ...</p>
            <button class="btn-restart" onclick="resetMatch()">جولة جديدة فوراً</button>
        </div>
    </div>

    <!-- أزرار الاختبار الخاصة بالسيارات -->
    <div class="controls">
        <button class="ctrl-btn" style="background:#ef4444;" onclick="pullCar('1', 3, 'مشاهد حمراء')">سحب حمراء (1) 🏎️</button>
        <button class="ctrl-btn" style="background:#3b82f6;" onclick="pullCar('2', 3, 'مشاهد زرقاء')">سحب زرقاء (2) 🚙</button>
        <button class="ctrl-btn" style="background:#f59e0b; color:#000;" onclick="pullCar('1', 15, 'هدية تيربو')">تيربو حمراء 🌹</button>
        <button class="ctrl-btn" style="background:#06b6d4; color:#000;" onclick="pullCar('2', 15, 'هدية تيربو')">تيربو زرقاء 🌹</button>
    </div>

    <script>
        let rigPosition = 50; 
        let isRunning = true;

        const tugRig = document.getElementById('tugRig');
        const ticker = document.getElementById('ticker');
        const arenaCard = document.getElementById('arenaCard');
        const victoryScreen = document.getElementById('victoryScreen');
        const winnerHeading = document.getElementById('winnerHeading');
        const smokeRight = document.getElementById('smokeRight');
        const smokeLeft = document.getElementById('smokeLeft');

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playEngineRev(isTurbo) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = isTurbo ? 'sawtooth' : 'triangle';
            osc.frequency.setValueAtTime(isTurbo ? 180 : 110, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(isTurbo ? 420 : 160, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }

        function pullCar(team, power, username) {
            if (!isRunning) return;

            playEngineRev(power >= 10);

            if (power >= 10) {
                arenaCard.classList.add('shake');
                setTimeout(() => arenaCard.classList.remove('shake'), 350);
            }

            if (team === '1') {
                rigPosition -= power;
                smokeRight.style.opacity = '1';
                setTimeout(() => smokeRight.style.opacity = '0', 300);
                ticker.innerHTML = `🏎️ <b style="color:#ef4444">السيارة الحمراء</b> تتقدم بقوة (+${power}) بفضل التعليقات!`;
            } else if (team === '2') {
                rigPosition += power;
                smokeLeft.style.opacity = '1';
                setTimeout(() => smokeLeft.style.opacity = '0', 300);
                ticker.innerHTML = `🚙 <b style="color:#3b82f6">السيارة الزرقاء</b> تتقدم بقوة (+${power}) بفضل التعليقات!`;
            }

            if (rigPosition <= 16) {
                rigPosition = 16;
                declareWinner("🔴 انتصرت السيارة الحمراء وسحبت السيارة الزرقاء!");
            } else if (rigPosition >= 84) {
                rigPosition = 84;
                declareWinner("🔵 انتصرت السيارة الزرقاء وسحبت السيارة الحمراء!");
            }

            tugRig.style.left = rigPosition + '%';
        }

        function declareWinner(msg) {
            isRunning = false;
            winnerHeading.innerText = msg;
            victoryScreen.style.display = 'flex';
            setTimeout(resetMatch, 5000);
        }

        function resetMatch() {
            rigPosition = 50;
            isRunning = true;
            tugRig.style.left = '50%';
            victoryScreen.style.display = 'none';
            ticker.innerText = "🔥 جولة جديدة بدأت! اكتبوا 1 أو 2 لتحريك السيارات!";
        }

        function connectLive() {
            try {
                const ws = new WebSocket('ws://localhost:8765');
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    pullCar(data.team, data.power, data.user);
                };
                ws.onclose = () => setTimeout(connectLive, 3000);
            } catch (e) {}
        }
        connectLive();
    </script>
</body>
</html>
